# Ledge iOS + watchOS project definition for XcodeGen.
# Run: xcodegen generate
#
# IMPORTANT: change both bundle identifiers below (com.shashankkarpal.ledge and
# com.shashankkarpal.ledge.watchkitapp) to something unique before building on a
# free personal team. Keep the watch id as "<your iOS id>.watchkitapp" and
# keep WKCompanionAppBundleIdentifier equal to your iOS id.

name: Ledge

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"

packages:
  LedgeCore:
    path: ../../core

targets:
  Ledge:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Sources
    dependencies:
      - package: LedgeCore
      # LedgeWatch embed BEGIN (if you delete the LedgeWatch target below,
      # also delete the two lines between these markers)
      - target: LedgeWatch
        embed: true
      # LedgeWatch embed END
      - target: LedgeWidgets
        embed: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.shashankkarpal.ledge
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: GZAN9987X2
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Ledge
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.shashankkarpal.ledge
            CFBundleURLSchemes:
              - ledge
        NSRemindersUsageDescription: Entries you choose are handed to Reminders. Nothing else is read or written.
        NSRemindersFullAccessUsageDescription: Entries you choose are handed to Reminders. Nothing else is read or written.
        NSMicrophoneUsageDescription: Dictation capture is transcribed on device.
        NSSpeechRecognitionUsageDescription: Dictation capture is transcribed on device.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # LedgeWatch target BEGIN
  # If the watch app blocks your build (for example, no paired watch and you
  # just want the phone app), delete everything from "LedgeWatch target BEGIN"
  # to "LedgeWatch target END", plus the embed lines marked above, then run
  # xcodegen generate again.
  LedgeWatch:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - WatchSources
    dependencies:
      - package: LedgeCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.shashankkarpal.ledge.watchkitapp
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: GZAN9987X2
    info:
      path: WatchSources/Info.plist
      properties:
        CFBundleDisplayName: Ledge
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.shashankkarpal.ledge
        WKWatchOnly: false
  # LedgeWatch target END

  # A7: capture widgets + Control Center control. Deep-links into the app;
  # reads nothing, shows nothing, stays calm.
  LedgeWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - WidgetSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shashankkarpal.ledge.widgets
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: GZAN9987X2
    info:
      path: WidgetSources/Info.plist
      properties:
        CFBundleDisplayName: Ledge
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Ledge:
    build:
      targets:
        Ledge: all
    run:
      config: Debug
